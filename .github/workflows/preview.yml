# Предпросмотр сайта на GitHub Pages: https://<владелец>.github.io/<репозиторий>/
# (для этого репозитория — https://altrinid.github.io/dykhanov-consult/).
#
# После каждого push в любую ветку сайт собирается и выкладывается в ветку gh-pages.
# По ссылке всегда последняя отправленная версия. Предпросмотр закрыт от поисковиков,
# форма заявки в нём ничего не отправляет (scripts/preview.mjs).
#
# Включить один раз: Settings → Pages → Build and deployment → Source: Deploy from a branch →
# Branch: gh-pages, / (root) → Save. Бесплатно GitHub Pages работает только для публичных репозиториев.
name: Preview

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npx astro build

      - name: Копия для GitHub Pages
        run: node scripts/preview.mjs dist preview "/${GITHUB_REPOSITORY#*/}/"

      - name: Выкладка в ветку gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd preview
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Предпросмотр: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Предпросмотр: $url"
          echo "Предпросмотр ветки \`${GITHUB_REF_NAME}\`: $url" >> "$GITHUB_STEP_SUMMARY"
